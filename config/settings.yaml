# Factory AI Tracking System Configuration
# Module 1 & 2 Implementation

system:
  name: "Factory AI Tracking System"
  version: "1.0.0"
  factory: "Gumcorp Factory"
  total_area_sqm: 1824
  debug: true
  fps_target: 15

runtime:
  camera_profile: "main_stream"
  inference_width: 1280
  aruco_max_width: 1920
  aruco_every_n_frames: 3
  aruco_workers: 3
  batch_size: 4
  dashboard_image_width: 960
  dashboard_fps: 10
  image_writer_workers: 2
  path_video_every_n_frames: 10
  path_video_fps: 5.0
  path_video_codec: "mp4v"
  redirect_decoder_logs: true
  decoder_log_file: "logs/decoder_ffmpeg.log"
  monitor_interval_seconds: 2.0
  reconnect_after: 10
  reconnect_interval_seconds: 5.0
  stale_camera_after_seconds: 3.0
  marker_confirmations_required: 2
  marker_stale_after_seconds: 8.0
  person_box_margin: 0.15
  min_marker_area: 80
  employee_records_file: "logs/employee_records.json"
  jpeg_quality_live: 65
  camera_registry_file: "data/cameras.json"

camera_profiles:
  main_stream:
    resolution: "1920x1080"
    fps: 15
    bitrate: 1025
    codec: "h264"
  sub_stream:
    resolution: "720x576"
    fps: 15
    bitrate: 512

