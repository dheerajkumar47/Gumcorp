# Factory AI Tracking System Configuration
# Module 1 & 2 Implementation

system:
  name: "Factory AI Tracking System"
  version: "1.0.0"
  factory: "Gumcorp Factory"
  total_area_sqm: 1824
  debug: true
  fps_target: 15

runtime:
  camera_profile: "main_stream"
  inference_width: 1280
  aruco_max_width: 1920
  aruco_every_n_frames: 2
  aruco_workers: 2
  aruco_crop_first_enabled: true
  aruco_crop_zoom: 4.0
  aruco_crop_margin_ratio: 0.15
  aruco_full_frame_fallback: false
  batch_size: 4
  dashboard_image_width: 1280
  dashboard_fps: 5
  image_writer_workers: 1
  path_video_every_n_frames: 6
  path_video_fps: 2.5
  path_video_min_frames: 2
  path_video_codec: "mp4v"
  redirect_decoder_logs: true
  decoder_log_file: "logs/decoder_ffmpeg.log"
  monitor_interval_seconds: 2.0
  reconnect_after: 45
  reconnect_interval_seconds: 3.0
  stale_camera_after_seconds: 30.0
  marker_confirmations_required: 1
  marker_stale_after_seconds: 8.0
  marker_hidden_grace_seconds: 90.0
  marker_hidden_match_radius_px: 220.0
  marker_hidden_max_seconds: 90.0
  marker_hidden_min_iou: 0.02
  tracker_iou_threshold: 0.12
  tracker_center_radius_px: 180.0
  tracker_max_age_seconds: 6.0
  reid_match_threshold: 0.72
  reid_max_gap_seconds: 45.0
  person_box_margin: 0.15
  min_marker_area: 60
  activity_upper_motion_threshold: 0.026
  activity_gesture_motion_threshold: 0.018
  activity_idle_after_seconds: 20.0
  employee_records_file: "logs/employee_records.json"
  jpeg_quality_live: 82
  camera_registry_file: "data/cameras.json"

camera_profiles:
  main_stream:
    resolution: "1920x1080"
    fps: 15
    bitrate: 1025
    codec: "h264"
  sub_stream:
    resolution: "720x576"
    fps: 15
    bitrate: 512

