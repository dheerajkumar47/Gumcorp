<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Intelligence | Live Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(23, 28, 41, 0.8);
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f1f5f9;
            --text-dim: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow: hidden; }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
        .live-status { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--success); }
        .pulse { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; }
        
        main { display: grid; grid-template-columns: 350px 1fr 350px; height: calc(100vh - 71px); padding: 20px; gap: 20px; }

        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .panel { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .panel h2 { font-size: 14px; color: var(--text-dim); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }

        .stat-card { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .stat-val { font-size: 32px; font-weight: 700; color: var(--text); }
        .stat-label { font-size: 12px; color: var(--text-dim); }

        .camera-grid { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .cam-thumb { position: relative; border-radius: 15px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: 0.3s; background: #000; }
        .cam-thumb img { width: 100%; display: block; filter: brightness(0.7); }
        .cam-thumb.active { border-color: var(--accent); }
        .cam-thumb.active img { filter: brightness(1); }
        .cam-info { position: absolute; bottom: 10px; left: 10px; font-size: 12px; font-weight: 600; text-shadow: 0 0 10px black; }

        .main-view { position: relative; background: #000; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        #big-stream { width: 100%; height: 100%; object-fit: contain; }
        .view-label { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; font-weight: 600; font-size: 14px; backdrop-filter: blur(5px); z-index: 10; }

        .worker-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .worker-item { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .status-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 4px; }
        .status-working { background: var(--success); color: #fff; }
        .status-walking { background: var(--warning); color: #fff; }

        /* Lunch Break — header tag only, no overlay */

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #171c29; width: 700px; border-radius: 30px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .modal-close { position: absolute; top: 20px; right: 20px; cursor: pointer; color: var(--text-dim); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">GUMCORP <span style="font-weight: 300; color: var(--text-dim);">AI</span></div>
        <div id="break-status" style="display:none; color: var(--warning); font-weight: 700; letter-spacing: 2px;">FACTORY LUNCH BREAK IN PROGRESS</div>
        <div class="live-status">
            <div class="pulse"></div>
            LIVE FEED AGGREGATOR <span id="clock" style="margin-left: 20px; color: var(--text-dim);">00:00:00</span>
        </div>
    </header>

    <main>
        <div class="sidebar">
            <div class="panel">
                <h2>System Overview</h2>
                <div class="stat-card">
                    <div><div class="stat-val" id="total-workers">0</div><div class="stat-label">Active Workers</div></div>
                    <div><div class="stat-val" id="active-cams">0</div><div class="stat-label">Cams Online</div></div>
                </div>
                <div class="stat-card" style="margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                    <div><div class="stat-val" id="uptime" style="font-size: 18px;">0s</div><div class="stat-label">System Uptime</div></div>
                </div>
            </div>
            <div class="panel" style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
                <h2>Camera Select</h2>
                <div class="camera-grid" id="cam-thumbs"></div>
            </div>
        </div>

        <div class="main-view">
            <div class="view-label" id="active-cam-label">Select a camera</div>
            <!-- Visible stream image -->
            <img id="big-stream" src="" alt="Stream View" style="width: 100%; height: auto; display: block;">
            <!-- Hidden buffer for smooth swapping -->
            <img id="big-stream-buffer" src="" alt="" style="display: none;">
        </div>

        <div class="sidebar">
            <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
                <h2>Personnel List</h2>
                <div class="worker-list" id="worker-list"></div>
            </div>
            <div class="panel" style="margin-top: 20px;">
                <h2>🔥 Activity Heatmap</h2>
                <div style="height: 150px; overflow: hidden; border-radius: 15px; margin-top: 10px;">
                    <img id="heatmap-img" src="/outputs/heatmap.jpg" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()"><div class="modal-close" onclick="closeModal()">✕</div><div id="modal-content"></div></div>
    </div>

    <script>
        let activeCamId = null;
        let lastData = null;

        // Global state to track loading images
        const imgStates = {};

        function updateImgSmoothly(targetId, newSrc) {
            const visibleImg = document.getElementById(targetId);
            if (!visibleImg) return;

            if (!imgStates[targetId]) imgStates[targetId] = { loading: false };
            if (imgStates[targetId].loading) return; // Skip if still loading previous frame

            let bufferImg = document.getElementById(targetId + '-buffer');
            if (!bufferImg) {
                bufferImg = document.createElement('img');
                bufferImg.id = targetId + '-buffer';
                bufferImg.style.display = 'none';
                document.body.appendChild(bufferImg);
            }

            imgStates[targetId].loading = true;
            const src = newSrc + (newSrc.includes('?') ? '&' : '?') + Date.now();
            
            bufferImg.onload = () => {
                visibleImg.src = bufferImg.src;
                imgStates[targetId].loading = false;
            };
            bufferImg.onerror = () => {
                imgStates[targetId].loading = false;
            };
            bufferImg.src = src;
        }

        async function updateData() {
            try {
                const res = await fetch('/logs/live_stats.json?' + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                lastData = data;
                
                document.getElementById('total-workers').innerText = data.total_person_count || 0;
                document.getElementById('active-cams').innerText = data.cameras.length;
                document.getElementById('uptime').innerText = data.uptime + 's';
                document.getElementById('clock').innerText = data.timestamp.split(' ')[1];

                // Lunch/Break: show header tag with specific message
                const isBreak = data.lunch_mode;
                const breakStatus = document.getElementById('break-status');
                breakStatus.style.display = isBreak ? 'block' : 'none';
                if (isBreak) {
                    breakStatus.innerText = data.break_message || 'FACTORY BREAK IN PROGRESS';
                }

                const thumbGrid = document.getElementById('cam-thumbs');
                data.cameras.forEach(cam => {
                    let thumb = document.getElementById(`thumb-${cam.id}`);
                    if (!thumb) {
                        thumb = document.createElement('div');
                        thumb.id = `thumb-${cam.id}`;
                        thumb.className = 'cam-thumb';
                        thumb.onclick = () => selectCam(cam.id);
                        thumb.innerHTML = `<img src=""><div class="cam-info">${cam.id}</div>`;
                        thumbGrid.appendChild(thumb);
                    }
                    // Update thumb smoothly
                    const thumbImg = thumb.querySelector('img');
                    const newThumbSrc = cam.live_view + '?' + Date.now();
                    const tBuffer = new Image();
                    tBuffer.onload = () => { thumbImg.src = newThumbSrc; };
                    tBuffer.src = newThumbSrc;
                    
                    thumb.className = `cam-thumb ${cam.id === activeCamId ? 'active' : ''}`;
                });

                if (!activeCamId && data.cameras.length > 0) selectCam(data.cameras[0].id);

                if (activeCamId) {
                    const activeCam = data.cameras.find(c => c.id === activeCamId);
                    if (activeCam) {
                        updateImgSmoothly('big-stream', activeCam.live_view);
                        document.getElementById('active-cam-label').innerText = `LIVE: ${activeCam.id} (${activeCam.person_count} detected)`;
                    }
                }

                updateImgSmoothly('heatmap-img', '/outputs/heatmap.jpg?' + Date.now());

                const list = document.getElementById('worker-list');
                if (data.stats && data.stats.length > 0) {
                    list.innerHTML = data.stats.map(s => `
                        <div class="worker-item" onclick="openProfile('${s.id}')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div style="width: 30px; height: 30px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color:#000;">${s.name.charAt(0)}</div>
                                <div><div style="font-weight: 600;">${s.name}</div><div style="font-size: 11px; color: var(--text-dim);">${s.dept}</div></div>
                            </div>
                            <div class="status-badge ${s.status === 'WORKING' ? 'status-working' : 'status-walking'}">${s.status}</div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 20px;">No workers identified</div>';
                }

                if (document.getElementById('modal-overlay').style.display === 'flex' && lastWorkerId) {
                    updateModalContent(lastWorkerId);
                }

            } catch (e) { console.error("Dashboard error:", e); }
        }

        let lastWorkerId = null;
        function openProfile(id) { lastWorkerId = id; updateModalContent(id); document.getElementById('modal-overlay').style.display = 'flex'; }

        function updateModalContent(id) {
            const worker = lastData.stats.find(s => s.id == id);
            if (!worker) return;

            const modalContent = document.getElementById('modal-content');
            
            // Surgical update if modal for this worker is already open
            if (modalContent.dataset.workerId == id) {
                const distEl = document.getElementById('modal-dist');
                if (distEl) distEl.innerText = worker.dist.toFixed(2) + ' ft';
                
                const statusBadge = modalContent.querySelector('.profile-header .status-badge');
                if (statusBadge) {
                    statusBadge.innerText = worker.status;
                    statusBadge.className = `status-badge ${worker.status === 'WORKING' ? 'status-working' : 'status-walking'}`;
                }
                
                updateImgSmoothly('modal-path-img', worker.path_view);
                return;
            }

            // Initial render
            modalContent.dataset.workerId = id;
            modalContent.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar">${worker.name.charAt(0)}</div>
                    <div>
                        <h1 style="font-size: 24px;">${worker.name}</h1>
                        <p style="color: var(--text-dim); font-size: 14px;">${worker.dept} Department</p>
                    </div>
                    <div style="margin-left: auto;" class="status-badge ${worker.status === 'WORKING' ? 'status-working' : 'status-walking'}">${worker.status}</div>
                </div>
                <div class="path-view-box" style="margin: 20px 0; border-radius: 15px; overflow: hidden; background: #000; border: 1px solid rgba(255,255,255,0.1);">
                    <div class="path-label" style="padding: 10px; font-size: 11px; color: var(--text-dim); text-transform: uppercase;">Movement Trail</div>
                    <img id="modal-path-img" src="${worker.path_view}?${Date.now()}" style="width: 100%; display: block;">
                </div>
                <div class="profile-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="p-stat-box" style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; text-align: center;">
                        <div class="p-stat-val" id="modal-dist" style="font-size: 24px; font-weight: 700;">${worker.dist.toFixed(2)} ft</div>
                        <div class="p-stat-label" style="font-size: 12px; color: var(--text-dim);">Distance Walked</div>
                    </div>
                    <div class="p-stat-box" style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; text-align: center;">
                        <div class="p-stat-val" style="color: var(--success); font-size: 24px; font-weight: 700;">ACTIVE</div>
                        <div class="p-stat-label" style="font-size: 12px; color: var(--text-dim);">Current State</div>
                    </div>
                </div>
            `;
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; lastWorkerId = null; }
        function selectCam(id) { activeCamId = id; }
        setInterval(updateData, 500);
    </script>
</body>
</html>
