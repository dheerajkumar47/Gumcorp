version: 1
site:
  name: Gumcorp Factory
  area_scope: production_area_initial_phase
  source_floor_plan_pdf: docs/camera_layout_rev02.pdf
  source_marked_image: docs/marking.jpg
  marked_image_size_px:
    width: 7017
    height: 9934
  notes:
    - Seed created from user-marked production layout and manually verified measurements.
    - Coordinates below are floor-plan seed coordinates in marked-image pixels.
    - Values are suitable for initial mapping and organization, not final homography output.

orientation:
  labels_from_marked_image:
    west: [2240, 1510]
    south: [1620, 2520]
    north: [2810, 2630]
    east: [2210, 3360]

zones:
  main_production_zone:
    type: primary_zone
    description: Big black rectangle marked by user; includes mixers, pallet line, sheet line, weighing, and packing flow.
    polygon_px:
      - [4300, 1050]
      - [5840, 1050]
      - [5840, 3900]
      - [4300, 3900]
    confidence: medium
  sheet_line_zone:
    type: machine_zone
    description: Sheet line machine area in upper production rectangle.
    polygon_px:
      - [4470, 1250]
      - [5280, 1250]
      - [5280, 1850]
      - [4470, 1850]
    machine_height_ft: 11.67
    confidence: medium
  main_production_machine_zone:
    type: machine_zone
    description: Center production machine area marked in user notes.
    polygon_px:
      - [4680, 1880]
      - [5530, 1880]
      - [5530, 3180]
      - [4680, 3180]
    machine_height_ft: 12.92
    confidence: medium
  pallet_line_zone:
    type: machine_zone
    description: Pallet line machine and walking path near production outside connection.
    polygon_px:
      - [4350, 3200]
      - [5110, 3200]
      - [5110, 3920]
      - [4350, 3920]
    machine_height_ft: 10.75
    confidence: medium
  raw_material_store_zone:
    type: adjacent_zone
    description: Right-side raw material store and staging strip near control room.
    polygon_px:
      - [5690, 3270]
      - [6240, 3270]
      - [6240, 4720]
      - [5690, 4720]
    confidence: medium
  cooling_room_2_zone:
    type: adjacent_zone
    description: Cooling room 2 room above main production block.
    polygon_px:
      - [4000, 1180]
      - [4480, 1180]
      - [4480, 1840]
      - [4000, 1840]
    confidence: medium

entries_and_paths:
  main_entry_01:
    type: entry
    description: User-marked main employee entry below production block.
    point_px: [4230, 3860]
    connects_to:
      - production_outside_path
      - pallet_line_zone
  main_exit_01:
    type: exit
    description: User-marked main exit beside production block.
    point_px: [3895, 3135]
    connects_to:
      - production2_zone_path
      - main_production_zone
  pallet_to_main_open_path:
    type: open_path
    description: Open movement path visible between pallet line and main production machine area.
    line_px:
      - [5030, 3350]
      - [5040, 2820]
  sheet_to_main_open_path:
    type: open_path
    description: Open movement path from sheet line toward center production zone.
    line_px:
      - [4890, 1820]
      - [4890, 2360]
  production_outside_path:
    type: open_path
    description: Open path around user-marked production outside camera arrow.
    line_px:
      - [4630, 3640]
      - [4380, 3850]

